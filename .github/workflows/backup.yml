name: Daily off-site backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch current database
        run: |
          curl -fsS "https://nfc-card-web-bpxv.onrender.com/internal/backup?token=${{ secrets.BACKUP_TOKEN }}" \
            -o backups/latest.json

      - name: Also keep a dated snapshot
        run: cp backups/latest.json "backups/$(date -u +%Y-%m-%d).json"

      - name: Commit if changed
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && echo "No changes" || git commit -m "Backup: $(date -u +%Y-%m-%d)"
          git push
