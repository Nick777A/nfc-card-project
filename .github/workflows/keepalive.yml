name: Keep Render service awake

on:
  schedule:
    # GitHub's scheduler can lag a few minutes under load, so ping well
    # under Render's free-tier 15-minute idle timeout.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz (retry through a cold start, which can take 30-50s)
        run: curl -fsS --max-time 60 --retry 2 --retry-delay 5 https://nfc-card-web-bpxv.onrender.com/healthz
